name: ✨ Funcionalidade
description: Sugira uma melhoria ou nova funcionalidade
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
      description: Qual dor esta funcionalidade resolve? Para quem?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como você imagina a solução?
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Requisito relacionado da RFC
      placeholder: "Ex.: RF10, RN05"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
