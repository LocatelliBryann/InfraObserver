name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  backend:
    name: Backend - Build and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: infraobserver
          POSTGRES_USER: infraobserver
          POSTGRES_PASSWORD: infraobserver_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infraobserver -d infraobserver"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://infraobserver:infraobserver_dev@localhost:5432/infraobserver

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Fix coverage paths for SonarQube
        run: sed -i "s#^SF:#SF:${GITHUB_WORKSPACE}/backend/#" coverage/lcov.info

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info

      - name: Build
        run: npm run build

  frontend:
    name: Frontend - Build and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Fix coverage paths for SonarQube
        run: sed -i "s#^SF:#SF:${GITHUB_WORKSPACE}/frontend/#" coverage/lcov.info

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

      - name: Build
        run: npm run build

  agent:
    name: Agent - Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage
          path: agent/coverage.xml

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Histórico completo melhora a análise de código novo e o blame
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Download agent coverage
        uses: actions/download-artifact@v4
        with:
          name: agent-coverage
          path: agent

       # No plano gratuito do SonarQube Cloud, só a develop (branch principal no Sonar)
      # e os pull requests têm Quality Gate. No push para a main o código já foi
      # aprovado no PR, então a análise roda sem esperar o resultado do gate.
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=${{ github.ref != 'refs/heads/main' }}
            -Dsonar.qualitygate.timeout=300

  docker:
    name: Docker - Build das imagens
    runs-on: ubuntu-latest

    strategy:
      matrix:
        context: [backend, frontend, agent]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (sem publicar)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.context }}
