name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  backend:
    name: Backend - Build and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: infraobserver
          POSTGRES_USER: infraobserver
          POSTGRES_PASSWORD: infraobserver_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infraobserver -d infraobserver"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://infraobserver:infraobserver_dev@localhost:5432/infraobserver

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Fix coverage paths for SonarQube
        run: sed -i "s#^SF:#SF:${GITHUB_WORKSPACE}/backend/#" coverage/lcov.info

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info

      - name: Build
        run: npm run build

  frontend:
    name: Frontend - Build and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Fix coverage paths for SonarQube
        run: sed -i "s#^SF:#SF:${GITHUB_WORKSPACE}/frontend/#" coverage/lcov.info

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

      - name: Build
        run: npm run build

  agent:
    name: Agent - Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage
          path: agent/coverage.xml

  e2e:
    name: E2E - Dashboard no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: infraobserver
          POSTGRES_USER: infraobserver
          POSTGRES_PASSWORD: infraobserver_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infraobserver -d infraobserver"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://infraobserver:infraobserver_dev@localhost:5432/infraobserver
      E2E_ADMIN_EMAIL: e2e@infraobserver.local
      E2E_API_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build da API
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      # Senha gerada nesta execução; nunca aparece no log.
      - name: Administrador do teste
        working-directory: backend
        run: |
          E2E_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$E2E_ADMIN_PASSWORD" "$E2E_ADMIN_PASSWORD" | npm run -s create-admin -- --email "$E2E_ADMIN_EMAIL" --name "E2E"

      # Fora de produção o cookie de sessão não exige HTTPS. O dashboard
      # (porta 4173) chama a API (porta 3000), então a origem é liberada.
      - name: Subir a API
        working-directory: backend
        run: |
          export CORS_ORIGINS="$E2E_BASE_URL"
          nohup npm start > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf "$E2E_API_URL/health" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1

      - name: Build e preview do dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf "$E2E_BASE_URL" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes E2E
        working-directory: e2e
        run: npx playwright test

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            backend/api.log
          if-no-files-found: ignore

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Histórico completo melhora a análise de código novo e o blame
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Download agent coverage
        uses: actions/download-artifact@v4
        with:
          name: agent-coverage
          path: agent

       # No plano gratuito do SonarQube Cloud, só a develop (branch principal no Sonar)
      # e os pull requests têm Quality Gate. No push para a main o código já foi
      # aprovado no PR, então a análise roda sem esperar o resultado do gate.
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=${{ github.ref != 'refs/heads/main' }}
            -Dsonar.qualitygate.timeout=300

  docker:
    name: Docker - Build das imagens
    runs-on: ubuntu-latest

    strategy:
      matrix:
        context: [backend, frontend, agent]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (sem publicar)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.context }}
