# Prometheus do InfraObserver: coleta as métricas da própria aplicação.
# Roda na rede interna do Docker; nenhum dos alvos abaixo é exposto na internet.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API: requisições, tempo de resposta, processo Node.js e métricas de negócio.
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]

  # Máquina virtual: CPU, memória, disco e rede.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
