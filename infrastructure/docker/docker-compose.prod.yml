# Ambiente de produção do InfraObserver.
# Usado pelo workflow de CD na VM da Azure; as imagens vêm do GitHub Container Registry.
# Variáveis: veja production.env.example (copiado como .env na VM).

name: infraobserver

# Limita o tamanho dos logs de cada container (3 arquivos de 10 MB) para não encher o disco.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infraobserver}
      POSTGRES_USER: ${POSTGRES_USER:-infraobserver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sem "ports": o banco só é acessível pela rede interna do Docker.

  backend:
    image: ${REGISTRY:-ghcr.io/locatellibryann}/infraobserver-backend:${IMAGE_TAG:-latest}
    logging: *default-logging
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-infraobserver}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-infraobserver}
      AGENT_TOKENS: ${AGENT_TOKENS:?defina AGENT_TOKENS no .env}
      AGENT_COLLECTION_INTERVAL_SECONDS: ${AGENT_COLLECTION_INTERVAL_SECONDS:-60}
      OFFLINE_CHECK_INTERVAL_SECONDS: ${OFFLINE_CHECK_INTERVAL_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Login do dashboard: assina o cookie de sessão (mínimo de 32 caracteres).
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      # Atrás do Caddy: o limite de tentativas de login usa o IP real do cliente.
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    # Sem "ports": a API é publicada pelo Caddy (serviço web).

  web:
    image: ${REGISTRY:-ghcr.io/locatellibryann}/infraobserver-web:${IMAGE_TAG:-latest}
    logging: *default-logging
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

  agent:
    image: ${REGISTRY:-ghcr.io/locatellibryann}/infraobserver-agent:${IMAGE_TAG:-latest}
    logging: *default-logging
    restart: unless-stopped
    hostname: ${DEMO_AGENT_HOSTNAME:-AZURE-SERVIDOR-01}
    environment:
      INFRAOBSERVER_SERVER_URL: http://backend:3000
      INFRAOBSERVER_AGENT_TOKEN: ${DEMO_AGENT_TOKEN:?defina DEMO_AGENT_TOKEN no .env}
      INFRAOBSERVER_AGENT_ID: ${DEMO_AGENT_ID:?defina DEMO_AGENT_ID no .env}
      INFRAOBSERVER_COLLECTION_INTERVAL: ${AGENT_COLLECTION_INTERVAL_SECONDS:-60}
      INFRAOBSERVER_MONITORED_DIRECTORIES: /data/monitored
    volumes:
      - agent_monitored:/data/monitored
    depends_on:
      backend:
        condition: service_healthy

  # --- Observabilidade (docs/observability.md) ---

  prometheus:
    image: prom/prometheus:v3.16.0
    logging: *default-logging
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    depends_on:
      - backend
    # Sem "ports": acessado só pelo Grafana, na rede interna.

  node-exporter:
    image: prom/node-exporter:v1.12.1
    logging: *default-logging
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m

  grafana:
    image: grafana/grafana-oss:13.0.2
    logging: *default-logging
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      # Publicado pelo Caddy em https://<domínio>/grafana/
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/infraobserver.json
      # Sem plugins extras e com o garbage collector liberando memória antes do limite.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GOMEMLIMIT: 700MiB
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 1g
    depends_on:
      - prometheus

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  agent_monitored:
  prometheus_data:
  grafana_data:
