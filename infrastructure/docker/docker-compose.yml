services:
  postgres:
    image: postgres:16-alpine
    container_name: infraobserver-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: infraobserver
      POSTGRES_USER: infraobserver
      POSTGRES_PASSWORD: infraobserver_dev

    ports:
      - "5432:5432"

    volumes:
      - infraobserver_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infraobserver -d infraobserver"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  infraobserver_postgres_data: