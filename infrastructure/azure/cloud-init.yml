#cloud-config
# InfraObserver - preparacao da VM na criacao
# (Azure: "Custom data" / "Dados personalizados").
# Instala o Docker, cria a pasta da aplicacao e um swap de 2 GB.
# ATENCAO: mantenha este arquivo somente com caracteres ASCII (sem acentos).
# Acentos podem ser corrompidos ao colar no portal e o cloud-init descarta
# o arquivo inteiro.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - unattended-upgrades

runcmd:
  # Docker Engine + Compose plugin (script oficial da Docker)
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - usermod -aG docker azureuser

  # Pasta onde o CD copia o docker-compose e onde fica o .env
  - mkdir -p /home/azureuser/infraobserver
  - chown azureuser:azureuser /home/azureuser/infraobserver

  # Swap de 2 GB (folga de memoria para VMs pequenas)
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
