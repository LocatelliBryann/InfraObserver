# SonarQube Cloud — https://sonarcloud.io/project/overview?id=LocatelliBryann_InfraObserver
sonar.projectKey=LocatelliBryann_InfraObserver
sonar.organization=locatellibryann
sonar.projectName=InfraObserver

sonar.sourceEncoding=UTF-8

# Código de produção dos três módulos
sonar.sources=backend/src,frontend/src,agent/src

# Testes (contam para cobertura, não entram como código de produção)
sonar.tests=backend/tests,frontend/tests,agent/tests

# Arquivos gerados ou de dependências
sonar.exclusions=**/node_modules/**,**/generated/**,**/dist/**,**/coverage/**,**/__pycache__/**

# Pontos de entrada que só fazem o bootstrap da aplicação
sonar.coverage.exclusions=backend/src/server.ts,frontend/src/main.tsx,frontend/src/vite-env.d.ts

# Relatórios de cobertura gerados no CI
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=agent/coverage.xml
sonar.python.version=3.12

# Faz o job falhar se o Quality Gate reprovar
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
